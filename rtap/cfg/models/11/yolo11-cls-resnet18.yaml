# RTAP — Real-Time Autonomous Perception (AGPL-3.0)

# RTAP11-cls image classification model with ResNet18 backbone
# Model docs: /models/yolo11
# Task docs: /tasks/classify

# Parameters
nc: 1000 # number of classes

# ResNet18 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, TorchVision, [512, resnet18, DEFAULT, True, 2]] # truncate two layers from the end

# YOLO11n head
head:
  - [-1, 1, Classify, [nc]] # Classify
